<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jotai + Holo · Rust</title>
    <link data-trunk rel="rust">
    <style>
      :root { color-scheme: light; font: 17px/1.5 system-ui, sans-serif; color: #202526; background: #f4f4ef; }
      body { max-width: 900px; margin: 60px auto; padding: 0 24px; }
      h1 { letter-spacing: -.04em; font-size: 44px; margin-bottom: 8px; }
      h2 { font-size: 20px; }
      .stores { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
      section { background: white; border: 1px solid #dedfd8; padding: 24px; border-radius: 16px; }
      button { font: inherit; cursor: pointer; padding: 8px 16px; margin: 4px 8px 4px 0; border: 1px solid #cbd1c8; border-radius: 8px; background: #eef4e8; }
      output { font-size: 36px; font-variant-numeric: tabular-nums; }
      small { display: block; color: #59625b; }
      .controls { margin: 24px 0; }
    </style>
  </head>
  <body></body>
</html>
